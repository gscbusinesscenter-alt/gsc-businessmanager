<style>
:root{--brand:#29235C;--bg:#F4F3FA;--ink:#1B1740;--mut:#5F5C85;--pri:#29235C;--on:#fff;--acc:#E6007E;--bad:#B3261E;--line:#DAD8EC;--card:#fff}
@media(prefers-color-scheme:dark){:root{--bg:#14122B;--ink:#ECEAFB;--mut:#A9A5D0;--pri:#A39CF2;--on:#14122B;--acc:#FF4DA6;--bad:#FF8A80;--line:#34306A;--card:#1D1A40}}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 'Hanken Grotesk',system-ui,sans-serif;background:var(--bg);color:var(--ink)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:6px;padding:6px 12px}
button:hover{border-color:var(--pri)}
button.pri{background:var(--pri);color:var(--on);border-color:var(--pri);font-weight:600}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
input,select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--card)}
label{display:block;font-size:13px;color:var(--mut);margin-bottom:10px}
label input,label select{margin-top:3px;color:var(--ink);font-size:15px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;padding:8px 20px;background:var(--brand);color:#fff}
.logo{height:44px;display:block}header .co{color:#CFCBF0}header nav button{color:#fff}header nav button:hover{border-color:transparent;background:#ffffff1f}header #out{background:none;color:#fff;border-color:#ffffff66}
.hero{background:var(--brand);border-radius:12px;padding:24px;display:flex;justify-content:center;margin-bottom:20px}.hero img{width:240px;max-width:100%;display:block}
nav{display:flex;gap:2px;overflow-x:auto;flex:1}
nav button{border:0;background:none;border-bottom:3px solid transparent;border-radius:0;padding:8px 10px;white-space:nowrap}
nav button.on{border-bottom-color:var(--acc);font-weight:600}
main{max-width:1050px;margin:0 auto;padding:20px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.bar h2{margin:0;flex:1;font-size:22px}.bar input,.bar select{width:auto;min-width:180px}
.warn{background:var(--acc);color:#fff;padding:8px 20px;font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.kpi span{display:block;font-size:13px;color:var(--mut)}.kpi b{font-size:21px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:16px}
.panel h3{margin:0 0 10px;font-size:16px}
.bars{display:flex;align-items:flex-end;gap:4px;height:130px}
.bars i{flex:1;background:var(--pri);border-radius:3px 3px 0 0;min-width:4px}
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:16px}
table{width:100%;border-collapse:collapse}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:13px;color:var(--mut);font-weight:600}
tr.low td:nth-child(5){color:var(--bad);font-weight:700}tr.off{opacity:.5}
.act{text-align:right}.act button,.act a{margin-left:6px;font-size:13px}
.empty{color:var(--mut);padding:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0 14px}
.line{display:grid;grid-template-columns:1fr 90px 36px;gap:8px;margin-bottom:8px}
.tot{margin:12px 0;font-size:18px}
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.plans .panel{margin:0}.plans .on{border:2px solid var(--pri)}
.auth{max-width:380px;margin:8vh auto;padding:0 20px}
.auth h1{margin:0 0 4px}.auth form button{width:100%;margin-top:8px;padding:10px}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}
dialog{border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);width:min(440px,92vw)}
dialog::backdrop{background:#0008}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw}
#toast.show{opacity:1}#toast.err{background:var(--bad);color:#fff}
@media(prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = n => new Intl.NumberFormat('fr-FR').format(n || 0);
const fmt = n => num(n) + ' FCFA';
const iso = d => d.toISOString().slice(0, 10);
const dt = v => new Date(v).toLocaleDateString('fr-FR');
const toast = (m, err) => { const t = $('#toast'); t.textContent = m; t.className = 'show' + (err ? ' err' : ''); setTimeout(() => t.className = '', 3500); };
let me = null, sub = null, plans = [], view = 'dash', cache = {}, lineHtml = () => '';
const expired = () => !!(sub && sub.ends_at && new Date(sub.ends_at).getTime() + 7 * 864e5 < Date.now());
const canWrite = () => !!me && ['owner', 'manager', 'seller'].includes(me.role) && !expired();
const call = async (fn, args) => { const { data, error } = await sb.rpc(fn, args); if (error) { toast(error.message, 1); throw error; } return data; };

// ---------- Démarrage ----------
async function boot() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return authView();
  const { data: p } = await sb.from('profiles').select('*,tenants(name)').eq('id', session.user.id).maybeSingle();
  if (!p) return setupView();
  me = p;
  sub = (await sb.from('subscriptions').select('*').eq('tenant_id', p.tenant_id).maybeSingle()).data;
  plans = (await sb.from('plans').select('*').order('price_month')).data || [];
  shell();
}
function authView() {
  $('#app').innerHTML = `<main class="auth"><div class="hero"><img src="${LOGO}" alt="GSC Business Center"></div><h1>Business Manager</h1><p>Toute votre entreprise sous contrôle, depuis une seule plateforme.</p>
  <form id="f"><label>E-mail<input name="email" type="email" required autocomplete="email"></label>
  <label>Mot de passe (8 caractères minimum)<input name="pw" type="password" minlength="8" required autocomplete="current-password"></label>
  <button class="pri">Se connecter</button><button type="button" id="su">Créer un compte</button></form></main>`;
  $('#f').onsubmit = async e => { e.preventDefault(); const f = new FormData(e.target);
    const { error } = await sb.auth.signInWithPassword({ email: f.get('email'), password: f.get('pw') });
    error ? toast('E-mail ou mot de passe incorrect', 1) : boot(); };
  $('#su').onclick = async () => { const f = $('#f'); if (!f.reportValidity()) return; const d = new FormData(f);
    const { data, error } = await sb.auth.signUp({ email: d.get('email'), password: d.get('pw') });
    if (error) return toast(error.message, 1);
    data.session ? boot() : toast('Compte créé. Confirmez votre e-mail, puis connectez-vous.'); };
}
function setupView() {
  $('#app').innerHTML = `<main class="auth"><div class="hero"><img src="${LOGO}" alt="GSC Business Center"></div><h1>Créez votre entreprise</h1><p>Dernière étape avant d’accéder à votre espace.</p>
  <form id="f"><label>Nom de l’entreprise<input name="n" required minlength="2"></label>
  <label>Secteur d’activité<input name="s" placeholder="Commerce, services, restauration…"></label>
  <label>Téléphone<input name="p" type="tel"></label><label>Votre nom complet<input name="u" required></label>
  <button class="pri">Créer mon espace</button></form></main>`;
  $('#f').onsubmit = async e => { e.preventDefault(); const f = new FormData(e.target);
    try { await call('create_tenant', { p_name: f.get('n'), p_sector: f.get('s'), p_phone: f.get('p'), p_full_name: f.get('u') }); boot(); } catch {} };
}
function shell() {
  const items = [['dash', 'Tableau de bord'], ['sales', 'Ventes'], ['customers', 'Clients'], ['products', 'Produits'], ['expenses', 'Dépenses'], ['plan', 'Abonnement'], ...(me.is_super_admin ? [['admin', 'Administration GSC']] : [])];
  $('#app').innerHTML = `<header><img class="logo" src="${LOGO}" alt="GSC Business Center"><span class="co">${esc(me.tenants?.name)}</span>
  <nav>${items.map(([v, l]) => `<button data-v="${v}">${l}</button>`).join('')}</nav><button id="out">Se déconnecter</button></header>
  ${expired() ? '<div class="warn">Abonnement expiré : lecture seule. Vos données sont conservées. Renouvelez dans l’onglet Abonnement.</div>' : ''}
  ${me.role === 'viewer' ? '<div class="warn">Accès en lecture seule.</div>' : ''}<main id="main"></main>`;
  const mark = () => document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.v === view));
  $('nav').onclick = e => { const b = e.target.closest('button'); if (b) { view = b.dataset.v; mark(); render(); } };
  $('#out').onclick = async () => { await sb.auth.signOut(); me = null; authView(); };
  $('#main').onclick = act; $('#main').oninput = e => { if (e.target.closest('#ln')) calc(); };
  mark(); render();
}
function render() {
  const v = { dash, sales, customers: () => list('customers'), products: () => list('products'), expenses: () => list('expenses'), plan, admin }[view];
  v().catch(() => {});
}

// ---------- Tableau de bord ----------
function range(k) { const t = new Date(), f = new Date(); if (k === '7') f.setDate(t.getDate() - 6); if (k === 'month') f.setDate(1); if (k === 'year') { f.setMonth(0); f.setDate(1); } return [iso(f), iso(t)]; }
async function dash(k = 'month') {
  const [f, t] = range(k); const d = await call('dashboard', { p_from: f, p_to: t }); const mx = Math.max(1, ...d.daily.map(x => x.v));
  $('#main').innerHTML = `<div class="bar"><h2>Tableau de bord</h2><select id="rg">${[['today', 'Aujourd’hui'], ['7', '7 derniers jours'], ['month', 'Ce mois'], ['year', 'Cette année']].map(([v, l]) => `<option value="${v}"${v === k ? ' selected' : ''}>${l}</option>`).join('')}</select></div>
  <div class="kpis">${[['Chiffre d’affaires', fmt(d.revenue)], ['Ventes', d.count], ['Dépenses', fmt(d.expenses)], ['Bénéfice estimé', fmt(d.profit)], ['À encaisser auprès des clients', fmt(d.receivables)]].map(([l, v]) => `<div class="kpi"><span>${l}</span><b>${v}</b></div>`).join('')}</div>
  <section class="panel"><h3>Ventes par jour</h3>${d.daily.length ? `<div class="bars">${d.daily.map(x => `<i title="${dt(x.d)} : ${fmt(x.v)}" style="height:${Math.max(4, x.v / mx * 100)}%"></i>`).join('')}</div>` : '<p class="empty">Aucune vente sur cette période.</p>'}</section>
  <section class="panel"><h3>Stock bas</h3>${d.low.length ? `<ul>${d.low.map(p => `<li>${esc(p.name)} : <b>${p.stock}</b> en stock</li>`).join('')}</ul>` : '<p class="empty">Aucun produit sous son seuil d’alerte.</p>'}</section>`;
  $('#rg').onchange = e => dash(e.target.value);
}

// ---------- Clients, produits, dépenses ----------
const ent = {
  customers: { s: 'client', t: 'Clients', req: ['name'], order: 'name', cols: [['name', 'Nom'], ['phone', 'Téléphone'], ['email', 'E-mail'], ['address', 'Adresse']] },
  products: { s: 'produit', t: 'Produits', req: ['name', 'price'], order: 'name', cols: [['name', 'Nom'], ['sku', 'Référence'], ['price', 'Prix de vente', 'm'], ['cost', "Prix d'achat", 'm'], ['stock', 'Stock', 'n'], ['alert_threshold', 'Seuil d’alerte', 'n']] },
  expenses: { s: 'dépense', t: 'Dépenses', req: ['spent_on', 'category', 'amount'], order: 'spent_on', cols: [['spent_on', 'Date', 'd'], ['category', 'Catégorie'], ['amount', 'Montant', 'm'], ['payee', 'Bénéficiaire'], ['method', 'Moyen de paiement']] }
};
const cell = (v, t) => t === 'm' ? fmt(v) : t === 'n' ? num(v) : t === 'd' ? dt(v) : esc(v);
async function list(k) {
  const c = ent[k];
  const { data, error } = await sb.from(k).select('*').is('deleted_at', null).order(c.order, { ascending: c.order === 'name' }).limit(500);
  if (error) return toast(error.message, 1);
  cache[k] = data;
  $('#main').innerHTML = `<div class="bar"><h2>${c.t}</h2><input id="q" type="search" placeholder="Rechercher">${canWrite() ? `<button class="pri" data-a="add" data-k="${k}">Ajouter un ${c.s}</button>` : ''}</div>
  <div class="tw"><table><thead><tr>${c.cols.map(x => `<th>${x[1]}</th>`).join('')}<th></th></tr></thead><tbody id="tb"></tbody></table></div>`;
  const draw = () => { const q = $('#q').value.toLowerCase(); const rows = data.filter(r => !q || JSON.stringify(r).toLowerCase().includes(q));
    $('#tb').innerHTML = rows.length ? rows.map(r => `<tr${k === 'products' && r.stock <= r.alert_threshold ? ' class="low"' : ''}>${c.cols.map(([f, , t]) => `<td>${cell(r[f], t)}</td>`).join('')}<td class="act">${canWrite() ? `<button data-a="edit" data-k="${k}" data-id="${r.id}">Modifier</button><button data-a="del" data-k="${k}" data-id="${r.id}">Supprimer</button>` : ''}</td></tr>`).join('')
      : `<tr><td colspan="9" class="empty">Aucun enregistrement.${canWrite() ? ' Cliquez sur « Ajouter » pour commencer.' : ''}</td></tr>`; };
  $('#q').oninput = draw; draw();
}
function form(k, row = {}) {
  const c = ent[k], d = $('#dlg');
  d.innerHTML = `<form id="ef"><h2>${row.id ? 'Modifier' : 'Ajouter'} : ${c.s}</h2>${c.cols.map(([f, l, t]) => {
    const isN = t === 'm' || t === 'n';
    const v = row[f] ?? (t === 'd' ? iso(new Date()) : isN ? (f === 'alert_threshold' ? 5 : 0) : '');
    return `<label>${l}<input name="${f}" type="${t === 'd' ? 'date' : isN ? 'number' : 'text'}" ${isN ? 'min="0" step="1"' : ''} value="${esc(v)}" ${c.req.includes(f) ? 'required' : ''}></label>`; }).join('')}
  <div class="row"><button type="button" id="cx">Annuler</button><button class="pri">Enregistrer</button></div></form>`;
  d.showModal(); $('#cx').onclick = () => d.close();
  $('#ef').onsubmit = async e => { e.preventDefault(); const o = {};
    new FormData(e.target).forEach((v, f) => { const t = c.cols.find(x => x[0] === f)[2]; o[f] = (t === 'm' || t === 'n') ? +v : (v === '' ? null : v); });
    const extra = { tenant_id: me.tenant_id, ...(k === 'expenses' ? { user_id: me.id } : {}) };
    const r = row.id ? await sb.from(k).update(o).eq('id', row.id) : await sb.from(k).insert({ ...o, ...extra });
    r.error ? toast(r.error.message, 1) : (d.close(), toast('Enregistré'), render()); };
}

// ---------- Ventes ----------
function calc() {
  let t = 0; document.querySelectorAll('#ln .line').forEach(l => { const s = l.querySelector('select'); const p = +(s.selectedOptions[0]?.dataset.p || 0); t += p * (+l.querySelector('input').value || 0); });
  $('#tt').textContent = fmt(t); $('#pd').value = t;
}
async function sales() {
  const [a, b, c] = await Promise.all([
    sb.from('customers').select('id,name').is('deleted_at', null).order('name'),
    sb.from('products').select('id,name,price,stock').is('deleted_at', null).eq('active', true).order('name'),
    sb.from('sales').select('*,customers(name)').order('created_at', { ascending: false }).limit(30)]);
  const cu = a.data || [], pr = b.data || [], sl = c.data || [];
  const opts = pr.map(p => `<option value="${p.id}" data-p="${p.price}">${esc(p.name)} : ${fmt(p.price)} (stock ${p.stock})</option>`).join('');
  lineHtml = () => `<div class="line"><select><option value="" data-p="0">Choisir un produit</option>${opts}</select><input type="number" min="1" value="1" aria-label="Quantité"><button type="button" data-a="rm" aria-label="Retirer la ligne">×</button></div>`;
  const form = canWrite() ? `<section class="panel"><h3>Nouvelle vente</h3>
  <div class="grid"><label>Client (facultatif)<select id="cu"><option value="">Client de passage</option>${cu.map(x => `<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></label>
  <label>Moyen de paiement<select id="mt"><option>Espèces</option><option>Wave</option><option>Orange Money</option><option>Free Money</option><option>Virement</option></select></label></div>
  <div id="ln">${lineHtml()}</div><button type="button" data-a="line">Ajouter un produit</button>
  <div class="tot">Total : <b id="tt">0 FCFA</b></div>
  <label>Montant encaissé (laissez moins que le total pour une vente à crédit)<input id="pd" type="number" min="0" value="0"></label>
  <button class="pri" data-a="sell">Enregistrer la vente</button></section>` : '';
  const rows = sl.map(s => { const r = s.total - s.paid; const ok = s.status === 'valid';
    const msg = encodeURIComponent(`Reçu n°${s.number} – ${me.tenants.name}\nTotal : ${fmt(s.total)}\nPayé : ${fmt(s.paid)}\nReste : ${fmt(r)}`);
    return `<tr class="${ok ? '' : 'off'}"><td>${s.number}</td><td>${dt(s.created_at)}</td><td>${esc(s.customers?.name || 'Client de passage')}</td><td>${fmt(s.total)}</td><td>${fmt(s.paid)}</td><td>${ok ? fmt(r) : 'Annulée'}</td>
    <td class="act">${ok && r > 0 && canWrite() ? `<button data-a="pay" data-id="${s.id}" data-r="${r}">Encaisser</button>` : ''}${ok && canWrite() && ['owner', 'manager'].includes(me.role) ? `<button data-a="cancel" data-id="${s.id}">Annuler</button>` : ''}${ok ? `<a href="https://wa.me/?text=${msg}" target="_blank" rel="noopener">Reçu WhatsApp</a>` : ''}</td></tr>`; }).join('');
  $('#main').innerHTML = `<div class="bar"><h2>Ventes</h2></div>${form}<div class="tw"><table><thead><tr><th>N°</th><th>Date</th><th>Client</th><th>Total</th><th>Payé</th><th>Reste</th><th></th></tr></thead><tbody>${rows || '<tr><td colspan="7" class="empty">Aucune vente enregistrée.</td></tr>'}</tbody></table></div>`;
}

// ---------- Abonnement ----------
async function plan() {
  const py = (await sb.from('saas_payments').select('*').order('created_at', { ascending: false }).limit(10)).data || [];
  const cur = plans.find(p => p.id === sub?.plan_id);
  const lim = n => n >= 999999 ? 'illimité' : num(n);
  $('#main').innerHTML = `<div class="bar"><h2>Abonnement</h2></div>
  <section class="panel"><h3>Formule actuelle : ${esc(cur?.name)}</h3><p>${sub?.ends_at ? `Valable jusqu’au ${dt(sub.ends_at)}${expired() ? ' (expiré)' : ''}` : 'Sans échéance'}</p></section>
  <div class="plans">${plans.map(p => `<div class="panel${p.id === sub?.plan_id ? ' on' : ''}"><h3>${p.name}</h3><b>${fmt(p.price_month)}</b> / mois<br><small>${fmt(p.price_year)} / an</small>
  <ul><li>${lim(p.max_users)} utilisateur(s)</li><li>${lim(p.max_products)} produits</li><li>${lim(p.max_sales_month)} ventes / mois</li></ul>
  ${me.role === 'owner' && p.price_month > 0 ? `<button class="pri" data-a="plan" data-id="${p.id}">Choisir cette formule</button>` : ''}</div>`).join('')}</div>
  <h3 style="margin-top:20px">Mes demandes de paiement</h3><div class="tw"><table><thead><tr><th>Date</th><th>Formule</th><th>Montant</th><th>Référence</th><th>Statut</th></tr></thead><tbody>${py.map(x => `<tr><td>${dt(x.created_at)}</td><td>${esc(x.plan_id)} (${x.period === 'yearly' ? 'annuel' : 'mensuel'})</td><td>${fmt(x.amount)}</td><td>${esc(x.reference)}</td><td>${{ pending: 'En attente de validation', validated: 'Validé', rejected: 'Rejeté' }[x.status]}</td></tr>`).join('') || '<tr><td colspan="5" class="empty">Aucune demande.</td></tr>'}</tbody></table></div>`;
}
function payForm(id) {
  const p = plans.find(x => x.id === id), d = $('#dlg');
  d.innerHTML = `<form id="pf"><h2>Formule ${p.name}</h2><p>Payez le montant sur le compte GSC communiqué par votre conseiller, puis saisissez la référence de la transaction. La formule est activée après vérification du paiement.</p>
  <label>Période<select name="per"><option value="monthly">Mensuel : ${fmt(p.price_month)}</option><option value="yearly">Annuel : ${fmt(p.price_year)}</option></select></label>
  <label>Moyen de paiement<select name="m"><option>Wave</option><option>Orange Money</option><option>Free Money</option><option>Virement bancaire</option></select></label>
  <label>Référence de la transaction<input name="r" required></label>
  <div class="row"><button type="button" id="cx">Annuler</button><button class="pri">Envoyer la demande</button></div></form>`;
  d.showModal(); $('#cx').onclick = () => d.close();
  $('#pf').onsubmit = async e => { e.preventDefault(); const f = new FormData(e.target);
    const { error } = await sb.from('saas_payments').insert({ tenant_id: me.tenant_id, plan_id: id, period: f.get('per'), amount: f.get('per') === 'yearly' ? p.price_year : p.price_month, method: f.get('m'), reference: f.get('r') });
    error ? toast(error.message, 1) : (d.close(), toast('Demande envoyée'), render()); };
}

// ---------- Administration GSC ----------
async function admin() {
  const [t, p] = await Promise.all([
    sb.from('tenants').select('*,subscriptions(plan_id,period,ends_at)').order('created_at', { ascending: false }),
    sb.from('saas_payments').select('*,tenants(name)').eq('status', 'pending').order('created_at')]);
  const T = (t.data || []).map(x => ({ ...x, s: [].concat(x.subscriptions)[0] }));
  const paying = T.filter(x => x.s && x.s.plan_id !== 'decouverte' && (!x.s.ends_at || new Date(x.s.ends_at) > new Date()));
  const mrr = paying.reduce((a, x) => { const pl = plans.find(q => q.id === x.s.plan_id); return a + (x.s.period === 'yearly' ? pl.price_year / 12 : pl.price_month); }, 0);
  $('#main').innerHTML = `<div class="bar"><h2>Administration GSC</h2></div>
  <div class="kpis">${[['Entreprises inscrites', T.length], ['Clients payants', paying.length], ['MRR', fmt(Math.round(mrr))], ['Conversion', T.length ? Math.round(paying.length / T.length * 100) + ' %' : '0 %']].map(([l, v]) => `<div class="kpi"><span>${l}</span><b>${v}</b></div>`).join('')}</div>
  <h3>Paiements à valider</h3><div class="tw"><table><thead><tr><th>Date</th><th>Entreprise</th><th>Formule</th><th>Montant</th><th>Moyen</th><th>Référence</th><th></th></tr></thead><tbody>${(p.data || []).map(x => `<tr><td>${dt(x.created_at)}</td><td>${esc(x.tenants?.name)}</td><td>${esc(x.plan_id)} (${x.period === 'yearly' ? 'annuel' : 'mensuel'})</td><td>${fmt(x.amount)}</td><td>${esc(x.method)}</td><td>${esc(x.reference)}</td><td class="act"><button class="pri" data-a="validate" data-id="${x.id}">Valider</button><button data-a="reject" data-id="${x.id}">Rejeter</button></td></tr>`).join('') || '<tr><td colspan="7" class="empty">Aucun paiement en attente.</td></tr>'}</tbody></table></div>
  <h3>Entreprises clientes</h3><div class="tw"><table><thead><tr><th>Entreprise</th><th>Secteur</th><th>Téléphone</th><th>Formule</th><th>Échéance</th><th>Statut</th><th></th></tr></thead><tbody>${T.map(x => `<tr><td>${esc(x.name)}</td><td>${esc(x.sector)}</td><td>${esc(x.phone)}</td><td>${esc(x.s?.plan_id)}</td><td>${x.s?.ends_at ? dt(x.s.ends_at) : '—'}</td><td>${x.status === 'active' ? 'Actif' : 'Suspendu'}</td><td class="act"><button data-a="status" data-id="${x.id}" data-s="${x.status === 'active' ? 'suspended' : 'active'}">${x.status === 'active' ? 'Suspendre' : 'Réactiver'}</button></td></tr>`).join('')}</tbody></table></div>`;
}

// ---------- Actions (délégation d’événements) ----------
async function act(e) {
  const b = e.target.closest('[data-a]'); if (!b) return; const a = b.dataset.a, id = b.dataset.id, k = b.dataset.k;
  try {
    if (a === 'add') form(k);
    else if (a === 'edit') form(k, cache[k].find(r => r.id === id));
    else if (a === 'del') { if (!confirm('Supprimer cet enregistrement ? Il sera retiré de vos listes.')) return;
      const { error } = await sb.from(k).update({ deleted_at: new Date().toISOString() }).eq('id', id); if (error) throw toast(error.message, 1); toast('Supprimé'); render(); }
    else if (a === 'line') { $('#ln').insertAdjacentHTML('beforeend', lineHtml()); }
    else if (a === 'rm') { if (document.querySelectorAll('#ln .line').length > 1) { b.closest('.line').remove(); calc(); } }
    else if (a === 'sell') {
      const items = [...document.querySelectorAll('#ln .line')].map(l => ({ product_id: l.querySelector('select').value, qty: +l.querySelector('input').value })).filter(i => i.product_id && i.qty > 0);
      await call('create_sale', { p_customer: $('#cu').value || null, p_items: items, p_paid: +$('#pd').value || 0, p_method: $('#mt').value }); toast('Vente enregistrée'); render(); }
    else if (a === 'pay') { const v = +prompt(`Montant encaissé (reste à payer : ${fmt(b.dataset.r)})`, b.dataset.r); if (!v) return; await call('add_sale_payment', { p_sale: id, p_amount: v }); toast('Paiement enregistré'); render(); }
    else if (a === 'cancel') { const r = prompt('Motif de l’annulation'); if (!r) return; await call('cancel_sale', { p_sale: id, p_reason: r }); toast('Vente annulée, stock remis à jour'); render(); }
    else if (a === 'plan') payForm(id);
    else if (a === 'validate') { await call('admin_validate_payment', { p_payment: id }); toast('Paiement validé, formule activée'); render(); }
    else if (a === 'reject') { const { error } = await sb.from('saas_payments').update({ status: 'rejected' }).eq('id', id); if (error) throw toast(error.message, 1); toast('Paiement rejeté'); render(); }
    else if (a === 'status') { await call('admin_set_status', { p_tenant: id, p_status: b.dataset.s }); toast('Statut mis à jour'); render(); }
  } catch {}
}
boot();
</script>
</body>
</html>
